<!DOCTYPE html>
<!-- Parcial #2  -->
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadoras - Parcial #2</title>
  <!-- Enlace a la hoja de css -->
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <!-- ENCABEZADO -->
  <header class="encabezado">
    <h1 id="titulo">Cubo de un número</h1>
  </header>

  <!-- MENú -->
  <nav class="menu">
    <button class="tab activa" data-seccion="cubo" data-titulo="Cubo de un número">Cubo</button>
    <button class="tab" data-seccion="triangulo" data-titulo="Área de un triángulo">Triángulo</button>
    <button class="tab" data-seccion="promedio" data-titulo="Promedio de calificaciones">Promedio</button>
    <button class="tab" data-seccion="comparar" data-titulo="Comparación de dos valores">Comparar</button>
  </nav>

  <main>

    <!-- PESTAÑA 1- CUBO DE UN NÚMERO -->
    <section id="cubo" class="tarjeta visible">
      <h2>Ingresa un número</h2>
      <input type="number" id="cuboNumero" placeholder="Ej: 3" step="any">
      <button class="btn-calcular" id="btnCubo">Calcular cubo</button>
      <p class="resultado" id="resCubo"></p>
    </section>

    <!-- PESTAÑA 2- ÁREA DE UN TRIÁNGULO -->
    <section id="triangulo" class="tarjeta">
      <h2>Ingresa base y altura (en metros)</h2>
      <input type="number" id="triBase" placeholder="Base (m)" step="any">
      <input type="number" id="triAltura" placeholder="Altura (m)" step="any">
      <button class="btn-calcular" id="btnTriangulo">Calcular área</button>
      <p class="resultado" id="resTriangulo"></p>
    </section>

    <!-- PESTAÑA 3: PROMEDIO DE CALIFICACIONES -->
    <section id="promedio" class="tarjeta">
      <h2>Ingresa el estudiante y sus notas</h2>
      <input type="text" id="proNombre" placeholder="Nombre del estudiante" maxlenght="18">
      <input type="number" id="proNota1" placeholder="Calificación 1" step="any">
      <input type="number" id="proNota2" placeholder="Calificación 2" step="any">
      <input type="number" id="proNota3" placeholder="Calificación 3" step="any">
      <button class="btn-calcular" id="btnPromedio">Calcular promedio</button>
      <p class="resultado" id="resPromedio"></p>
      <!-- NUEVO: aquí se muestra la calificación final en letra -->
      <p class="resultado" id="resLetra"></p>
    </section>

    <!-- PESTAÑA 4- COMPARACIÓN DE DOS VALORES -->
    <section id="comparar" class="tarjeta">
      <h2>Ingresa dos números</h2>
      <input type="number" id="cmpA" placeholder="Primer número" step="any">
      <input type="number" id="cmpB" placeholder="Segundo número" step="any">
      <button class="btn-calcular" id="btnComparar">Comparar</button>
      <p class="resultado" id="resComparar"></p>
    </section>

  </main>

  <!-- Enlace al archivo javascript -->
  <script src="js/script.js"></script>
</body>
</html>
